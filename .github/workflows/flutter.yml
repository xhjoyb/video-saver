name: Flutter CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: keystore
          key: videosaver-keystore-v1

      - name: Ensure signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > keystore/release.jks
            echo "keystore restored from repository secret"
          elif [ -f keystore/release.jks ]; then
            echo "keystore restored from actions cache"
          else
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -storetype PKCS12 \
              -alias videosaver \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "${{ secrets.ANDROID_KS_PASS }}" -keypass "${{ secrets.ANDROID_KS_PASS }}" \
              -dname "CN=VideoSaver, OU=Dev, O=xhjoyb, L=CN, ST=CN, C=CN"
            echo "keystore generated"
          fi
          ls -l keystore/release.jks
          keytool -list -v -keystore keystore/release.jks -storepass "${{ secrets.ANDROID_KS_PASS }}" 2>/dev/null \
            | grep -E "SHA1:|SHA256:" | head -2

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        timeout-minutes: 10
        run: flutter pub get

      - name: Analyze
        timeout-minutes: 10
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        timeout-minutes: 30
        env:
          KS_FILE: ${{ github.workspace }}/keystore/release.jks
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KS_ALIAS: videosaver
          KS_KEY_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          timeout -k 20 1500 flutter build apk --release --target-platform android-arm64 || {
            echo "::error::flutter build apk 失败或超时";
            exit 1;
          }

      - name: Show APK info
        run: |
          ls -lh build/app/outputs/flutter-apk/
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "APK=$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: videosaver-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flutter-${GITHUB_RUN_NUMBER}"
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          # 取上一版 release tag，用 compare API 生成「自上一版起」的变更（不依赖本地 tag）
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          CHANGES=""
          if [ -n "$PREV" ]; then
            CHANGES=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_SHA}" \
              --jq '.commits[] | .commit.message | split("\n")[0] | "- " + .' 2>/dev/null || true)
          fi
          if [ -n "$CHANGES" ]; then
            SCOPE="自 \`$PREV\` 起"
          else
            CHANGES=$(git log --no-merges --pretty=format:'- %s' -15 HEAD)
            SCOPE="最近 15 条提交（compare API 不可用时的兜底）"
          fi
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "## 变更（$SCOPE）"
            echo
            echo "$CHANGES"
            echo
            echo "## 构建信息"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| run | ${GITHUB_RUN_NUMBER} |"
            echo "| APK | ${SIZE} B |"
            echo "| SHA-256 | \`${SHA}\` |"
            echo
            echo "签名与历史版本一致，可直接覆盖安装。"
          } > notes.md
          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" "$APK" --title "VideoSaver $TAG" --notes-file notes.md; then
              echo "release $TAG published"
              exit 0
            fi
            echo "attempt $attempt failed, retry in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::warning::GitHub Release 发布失败（runner 网络问题），APK 仍可在 artifact 获取"
          exit 0