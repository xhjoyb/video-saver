name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: keystore
          key: videosaver-keystore-v1

      - name: Ensure signing keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -storetype PKCS12 \
              -alias videosaver \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass videosaver2025 -keypass videosaver2025 \
              -dname "CN=VideoSaver, OU=Dev, O=xhjoyb, L=CN, ST=CN, C=CN"
          fi
          ls -l keystore/release.jks

      - name: Build release APK
        env:
          KS_FILE: keystore/release.jks
          KS_PASS: videosaver2025
          KS_ALIAS: videosaver
          KS_KEY_PASS: videosaver2025
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: videosaver-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Backup keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: keystore/release.jks
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NOTES=$(printf '自动构建 %s\n\ncommit: %s\nrun: %s\n' "$TAG" "${GITHUB_SHA:0:7}" "${{ github.run_number }}")
          gh release create "$TAG" "$APK" --title "VideoSaver $TAG" --notes "$NOTES" || true
